{% extends "base.html" %}

{% block title %}Cadastrar Paciente - {{ config.nome_clinica }}{% endblock %}
{% block header_title %}Cadastrar Novo Paciente{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-person-plus"></i> Dados do Paciente</h5>
    </div>
    <div class="card-body">
        <form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="nome" class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>

                <div class="col-md-4 mb-3">
					<label for="cpf" class="form-label">CPF (opcional)</label>
					<input type="text" class="form-control cpf-mask" id="cpf" name="cpf" onblur="verificarCPF()">
					<div id="cpf-mensagem" class="mt-1"></div>
				</div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="data_nascimento" class="form-label">Data de Nascimento *</label>
                    <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="text" class="form-control celular-mask" id="celular" name="celular">
                </div>

                <div class="col-md-4 mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
            </div>

            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="endereco" name="endereco">
            </div>

            <div class="mb-3">
                <label for="observacoes" class="form-label">Observações</label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Cadastrar Paciente
            </button>
            <a href="{{ url_for('listar_pacientes') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </form>
    </div>
</div>

<script>
function verificarCPF() {
    const cpf = document.getElementById('cpf').value;
    const msgDiv = document.getElementById('cpf-mensagem');
    
    if (!cpf || cpf.replace(/[^0-9]/g, '').length < 11) {
        msgDiv.innerHTML = '<small class="text-muted">CPF em branco - será aceito</small>';
        return;
    }
    
    fetch('/api/validar-cpf?cpf=' + encodeURIComponent(cpf))
        .then(r => r.json())
        .then(data => {
            if (data.status === 'valido') {
                msgDiv.innerHTML = '<small class="text-success">✅ ' + data.mensagem + '</small>';
            } else if (data.status === 'existe') {
                msgDiv.innerHTML = '<small class="text-danger">❌ ' + data.mensagem + '</small>';
            } else if (data.status === 'invalido') {
                msgDiv.innerHTML = '<small class="text-danger">❌ ' + data.mensagem + '</small>';
            } else {
                msgDiv.innerHTML = '<small class="text-muted">CPF em branco - será aceito</small>';
            }
        });
}
</script>

{% endblock %}
